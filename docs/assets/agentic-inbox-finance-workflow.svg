<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Inbox finance workflow</title>
  <desc id="desc">A finance mailbox workflow: email arrives, attachments persist as artifacts, invoice extraction creates structured records, humans review, and outputs become drafts, exports, or MCP results.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="48%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="mail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .label { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .small { font-size: 18px; fill: #475569; }
      .tiny { font-size: 15px; fill: #64748b; }
      .title { font-size: 42px; font-weight: 800; letter-spacing: -0.03em; }
      .subtitle { font-size: 20px; fill: #475569; }
      .card-title { font-size: 24px; font-weight: 800; }
      .pill { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .line { stroke: #334155; stroke-width: 3; marker-end: url(#arrow); fill: none; stroke-linecap: round; }
      .soft-line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 8; fill: none; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; filter: url(#shadow); }
      .dark-label { fill: #ffffff; }
      .muted-box { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="url(#bg)"/>
  <circle cx="140" cy="120" r="78" fill="#fed7aa" opacity="0.45"/>
  <circle cx="1245" cy="124" r="112" fill="#a7f3d0" opacity="0.36"/>
  <circle cx="1180" cy="640" r="148" fill="#bae6fd" opacity="0.34"/>

  <text x="92" y="86" class="label title">Finance mailboxes become durable agent workflows</text>
  <text x="94" y="124" class="label subtitle">A vendor invoice email becomes a reviewable session with persisted artifacts, structured records, and human-approved outputs.</text>

  <g transform="translate(88 198)">
    <rect class="card" width="230" height="180" rx="28"/>
    <rect x="26" y="26" width="178" height="54" rx="18" fill="url(#mail)"/>
    <text x="48" y="61" class="label dark-label card-title">finance@</text>
    <text x="28" y="112" class="label small">Vendor invoice arrives</text>
    <text x="28" y="142" class="label tiny">Email thread = workflow session</text>
  </g>

  <path class="line" d="M 335 288 C 372 288, 386 288, 423 288"/>

  <g transform="translate(438 198)">
    <rect class="card" width="250" height="180" rx="28"/>
    <rect x="26" y="26" width="198" height="54" rx="18" fill="#e0f2fe"/>
    <text x="48" y="61" class="label card-title">Artifacts</text>
    <text x="28" y="112" class="label small">R2 stores source files</text>
    <text x="28" y="142" class="label tiny">XML / OFD / PDF / ZIP / links</text>
  </g>

  <path class="line" d="M 704 288 C 746 288, 760 288, 804 288"/>

  <g transform="translate(820 168)">
    <rect class="card" width="294" height="240" rx="30"/>
    <rect x="26" y="26" width="242" height="56" rx="18" fill="url(#agent)"/>
    <text x="48" y="62" class="label dark-label card-title">Invoice skill</text>
    <text x="30" y="118" class="label small">Extract structured records</text>
    <rect x="30" y="140" width="234" height="32" rx="16" fill="#ffedd5"/>
    <text x="48" y="162" class="label pill">Deterministic parser first</text>
    <rect x="30" y="182" width="234" height="32" rx="16" fill="#fef3c7"/>
    <text x="48" y="204" class="label pill">OCR fallback flagged for review</text>
  </g>

  <path class="line" d="M 1128 288 C 1168 288, 1180 288, 1218 288"/>

  <g transform="translate(1232 198)">
    <rect class="card" width="170" height="180" rx="28"/>
    <rect x="26" y="26" width="118" height="54" rx="18" fill="#dcfce7"/>
    <text x="48" y="61" class="label card-title">Review</text>
    <text x="28" y="112" class="label small">Human approves</text>
    <text x="28" y="142" class="label tiny">No surprise sending</text>
  </g>

  <g transform="translate(168 496)">
    <rect class="muted-box" width="260" height="120" rx="24"/>
    <text x="28" y="42" class="label card-title">Provenance</text>
    <text x="28" y="74" class="label small">Every field links back</text>
    <text x="28" y="100" class="label tiny">email id + attachment id + parser/OCR source</text>
  </g>

  <g transform="translate(516 496)">
    <rect class="muted-box" width="260" height="120" rx="24"/>
    <text x="28" y="42" class="label card-title">Outputs</text>
    <text x="28" y="74" class="label small">Drafts, exports, records</text>
    <text x="28" y="100" class="label tiny">Prepared by agent, approved by owner</text>
  </g>

  <g transform="translate(864 496)">
    <rect class="muted-box" width="260" height="120" rx="24"/>
    <text x="28" y="42" class="label card-title">MCP</text>
    <text x="28" y="74" class="label small">External agents query</text>
    <text x="28" y="100" class="label tiny">Same mailbox ACL + capability policy</text>
  </g>

  <path class="soft-line" d="M 965 410 C 900 478, 640 462, 300 496"/>
  <path class="soft-line" d="M 990 410 C 934 474, 760 470, 646 496"/>
  <path class="soft-line" d="M 1028 410 C 1044 458, 1030 474, 994 496"/>

  <text x="92" y="700" class="label subtitle">Core promise: the agent prepares work; humans approve sensitive outputs; the system records source evidence.</text>
</svg>
